name: Healthogram Test Pipeline

on:
  push:
    branches:
      - develop
      - 'release/**'
  pull_request:
    branches:
      - develop

permissions:
  contents: read

jobs:
  run_tests:
    name: Run Unit and Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Execute Full Test Suite
        run: |
          chmod +x ./gradlew || true
          gradle :app:testDebugUnitTest || ./gradlew :app:testDebugUnitTest
