name: Production Release Pipeline

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  validate_and_release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tagged Commit
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Run Test Verification
        run: |
          chmod +x ./gradlew || true
          gradle :app:testDebugUnitTest || ./gradlew :app:testDebugUnitTest

      - name: Build Release APK and App Bundle (AAB)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          fi
          gradle :app:assembleRelease :app:bundleRelease || ./gradlew :app:assembleRelease :app:bundleRelease

      - name: Package Source Code Archive (Without Secrets)
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          git archive --format=zip --output="Healthogram-${TAG_NAME}-source.zip" HEAD

      - name: Generate Release Notes & Changelog Extract
        id: release_notes
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "## Healthogram Release ${TAG_NAME}" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "### Highlights & Production Acceptance" >> RELEASE_NOTES.md
          echo "- **Verified Zero-Trust PHI Isolation**: AES-GCM-256 field encryption for all Health Passport records." >> RELEASE_NOTES.md
          echo "- **Session Protection**: Maximum 4 concurrent sessions with real-time push eviction." >> RELEASE_NOTES.md
          echo "- **Cryptographic QR Code Tokens**: 15-minute expiration and instantaneous patient revocation." >> RELEASE_NOTES.md
          echo "- **100-Order Financial Ledger Reconciliation**: Zero drift verified across seller payouts and platform commission." >> RELEASE_NOTES.md
          echo "- **11-State Delivery State Machine**: Strictly sequential status transitions with GPS write-throttling." >> RELEASE_NOTES.md
          echo "- **Supported Account Hierarchy**: Individual, Doctor, Clinic, Hospital, Laboratory; Customer, Seller." >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            Healthogram-*-source.zip
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            docs/qa/HEALTHOGRAM_PRODUCTION_ACCEPTANCE_MATRIX.md
            docs/qa/HEALTHOGRAM_RELEASE_CANDIDATE_CHECKLIST.md
