name: Firebase Deployment Pipeline

on:
  push:
    branches:
      - develop       # Development deployment
      - 'release/**'   # Staging deployment
      - main          # Production deployment
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production

concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy_development:
    name: Deploy to Firebase Development
    if: github.ref == 'refs/heads/develop' || github.event.inputs.target_env == 'development'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package.json

      - name: Install Firebase Tools & Function Dependencies
        run: |
          npm install -g firebase-tools
          cd functions && npm ci

      - name: Deploy Rules & Functions to Development
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_DEV_DEPLOY_TOKEN }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            firebase deploy --only firestore:rules,firestore:indexes,storage,functions --project healthogram-dev --token "$FIREBASE_TOKEN"
          else
            echo "FIREBASE_DEV_DEPLOY_TOKEN not configured; simulating dry-run validation."
            firebase --version
          fi

  deploy_staging:
    name: Deploy to Firebase Staging
    if: startsWith(github.ref, 'refs/heads/release/') || github.event.inputs.target_env == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package.json

      - name: Install Dependencies
        run: |
          npm install -g firebase-tools
          cd functions && npm ci

      - name: Deploy to Staging Environment
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_STAGING_DEPLOY_TOKEN }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            firebase deploy --only firestore:rules,firestore:indexes,storage,functions --project healthogram-staging --token "$FIREBASE_TOKEN"
          else
            echo "FIREBASE_STAGING_DEPLOY_TOKEN not configured; skipping remote deployment."
          fi

  deploy_production:
    name: Deploy to Firebase Production
    if: github.ref == 'refs/heads/main' || github.event.inputs.target_env == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package.json

      - name: Install Dependencies
        run: |
          npm install -g firebase-tools
          cd functions && npm ci

      - name: Deploy to Production Environment (Strict Authorization)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_PROD_DEPLOY_TOKEN }}
        run: |
          if [ -n "$FIREBASE_TOKEN" ]; then
            firebase deploy --only firestore:rules,firestore:indexes,storage,functions --project healthogram-prod --token "$FIREBASE_TOKEN"
          else
            echo "Production deployment requires FIREBASE_PROD_DEPLOY_TOKEN."
          fi
