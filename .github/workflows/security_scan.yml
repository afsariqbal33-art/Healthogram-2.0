name: Security Scan & Vulnerability Audit

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
  schedule:
    - cron: '0 4 * * 1' # Weekly security scan on Monday at 04:00 UTC

permissions:
  contents: read
  security-events: write

jobs:
  secret_and_leak_detection:
    name: Secret Leak & Credential Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce Secret Scanning Rules
        run: |
          echo "Scanning codebase for high-risk pattern indicators..."
          SECRETS_FOUND=0

          # Check for private keys
          if grep -rInE --exclude-dir={.git,build,.gradle} "-----BEGIN [A-Z ]*PRIVATE KEY-----" .; then
            echo "ERROR: Cryptographic private key found in repository!"
            SECRETS_FOUND=1
          fi

          # Check for live Google / Firebase API keys with server permissions
          if grep -rInE --exclude-dir={.git,build,.gradle} "AIzaSy[0-9A-Za-z_-]{33}" . | grep -v ".env.example" | grep -v "Placeholder"; then
            echo "WARNING: Check detected Google API Key string."
          fi

          # Check for Stripe live secret tokens
          if grep -rInE --exclude-dir={.git,build,.gradle} "sk_live_[0-9a-zA-Z]{24}" .; then
            echo "ERROR: Live Stripe secret key found in repository!"
            SECRETS_FOUND=1
          fi

          # Check for GitHub Personal Access Tokens
          if grep -rInE --exclude-dir={.git,build,.gradle} "ghp_[0-9a-zA-Z]{36}" .; then
            echo "ERROR: GitHub Personal Access Token found!"
            SECRETS_FOUND=1
          fi

          # Check for Slack Webhooks
          if grep -rInE --exclude-dir={.git,build,.gradle} "https://hooks.slack.com/services/T[0-9a-zA-Z]+/B[0-9a-zA-Z]+/[0-9a-zA-Z]+" .; then
            echo "ERROR: Live Slack webhook found!"
            SECRETS_FOUND=1
          fi

          if [ $SECRETS_FOUND -ne 0 ]; then
            echo "CRITICAL: Secrets detected in repository. Failing CI as per Section 31."
            exit 1
          fi
          echo "Secret scan passed successfully: 0 secrets detected."

  firebase_rules_audit:
    name: Firebase Rules Security Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Rules Files Exist and Are Non-Empty
        run: |
          test -s firestore.rules || { echo "firestore.rules missing or empty"; exit 1; }
          test -s storage.rules || { echo "storage.rules missing or empty"; exit 1; }
          test -s firestore.indexes.json || { echo "firestore.indexes.json missing or empty"; exit 1; }
          echo "Firebase rules and indexes verified."

      - name: Verify Zero-Trust Deny-by-Default
        run: |
          grep -q "allow read, write: if false" firestore.rules || echo "Notice: firestore.rules uses granular matching."
          echo "Rules audit passed."
