name: Android Build & Artifact Generation

on:
  push:
    branches:
      - develop
      - 'release/**'
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type to generate'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - debug_apk
          - release_apk
          - release_aab

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build_android:
    name: Build Android Packages (APK & AAB)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Keystore for Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secret..."
            echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore
          else
            echo "Release keystore secret not present; fallback to build without signing or debug."
          fi

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'debug_apk' || github.ref == 'refs/heads/develop'
        run: |
          chmod +x ./gradlew || true
          gradle :app:assembleDebug || ./gradlew :app:assembleDebug

      - name: Upload Debug APK Artifact
        if: github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'debug_apk' || github.ref == 'refs/heads/develop'
        uses: actions/upload-artifact@v4
        with:
          name: healthogram-debug-apk-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7

      - name: Build Release APK
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release_apk'
        run: |
          gradle :app:assembleRelease || ./gradlew :app:assembleRelease

      - name: Upload Release APK Artifact
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release_apk'
        uses: actions/upload-artifact@v4
        with:
          name: healthogram-release-apk-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Build Release AAB (Android App Bundle for Play Store)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release_aab'
        run: |
          gradle :app:bundleRelease || ./gradlew :app:bundleRelease

      - name: Upload Release AAB Artifact
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/') || github.event.inputs.build_type == 'all' || github.event.inputs.build_type == 'release_aab'
        uses: actions/upload-artifact@v4
        with:
          name: healthogram-release-aab-${{ github.sha }}
          path: app/build/outputs/bundle/release/*.aab
          retention-days: 90
