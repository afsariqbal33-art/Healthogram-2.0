name: Healthogram CI Pipeline

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
      - 'feature/**'
      - 'fix/**'
      - 'security/**'
      - 'performance/**'
      - 'gemini-3.8-flash'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  code_quality_and_lint:
    name: Code Quality & Lint Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v3

      - name: Run Static Analysis & Linter
        run: |
          chmod +x ./gradlew || true
          gradle lintDebug --continue || ./gradlew lintDebug --continue

  test_suite:
    name: Automated Unit & Robolectric Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Execute QA & Security Test Suites
        run: |
          chmod +x ./gradlew || true
          gradle :app:testDebugUnitTest || ./gradlew :app:testDebugUnitTest

      - name: Archive Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 14

  security_audit:
    name: Security Baseline Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Scan for Secret Leaks & Prohibited Private Keys
        run: |
          echo "Scanning for accidental secrets..."
          # Fail if private keys or unmasked production secrets are detected
          if grep -rE --exclude-dir={.git,build,.gradle} "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY" .; then
            echo "CRITICAL: Private key detected in repository!"
            exit 1
          fi
          if grep -rE --exclude-dir={.git,build,.gradle} "stripe_sk_live_[0-9a-zA-Z]{24}" .; then
            echo "CRITICAL: Live Stripe secret key detected in repository!"
            exit 1
          fi
          echo "No prohibited secrets found."
